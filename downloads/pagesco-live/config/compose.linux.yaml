# Linux and Windows (WSL 2) only, as in Lesson 1.2: run WordPress, WP-CLI and the scheduler as YOU, so the
# files in wordpress/, deploy/ and backups/ belong to you. Before the first start, from this folder:
#   printf 'PAGESCO_UID=%s\nPAGESCO_GID=%s\n' "$(id -u)" "$(id -g)" >> .env
#   cp config/compose.linux.yaml compose.override.yaml
#   mkdir wordpress deploy backups
services:
  wordpress:
    user: "${PAGESCO_UID:?run the Linux setup first}:${PAGESCO_GID:?run the Linux setup first}"
  wpcli:
    user: "${PAGESCO_UID:?run the Linux setup first}:${PAGESCO_GID:?run the Linux setup first}"
  cron:
    user: "${PAGESCO_UID:?run the Linux setup first}:${PAGESCO_GID:?run the Linux setup first}"
