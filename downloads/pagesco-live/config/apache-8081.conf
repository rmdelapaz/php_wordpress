# The live site on port 8081, inside the container too (so the address WordPress knows works for its own requests).
Listen 8081
<VirtualHost *:8081>
    DocumentRoot /var/www/html
</VirtualHost>

# Say less about the server in every response: "Server: Apache" instead of the version and the system.
ServerTokens Prod
ServerSignature Off

# Never serve files that are not meant for visitors: hidden files and folders (.git, .env, .htaccess;
# .well-known stays reachable, certificates need it)
# and database dumps or logs that someone left in the web root.
<FilesMatch "^\.(?!well-known)">
    Require all denied
</FilesMatch>
<DirectoryMatch "/\.(?!well-known)">
    Require all denied
</DirectoryMatch>
<FilesMatch "\.(sql|log)$">
    Require all denied
</FilesMatch>
