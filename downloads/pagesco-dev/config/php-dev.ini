; Development PHP settings for the course (loaded after the image's own settings)
error_reporting = E_ALL
html_errors = Off
log_errors = On
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
; see code changes immediately (the image's default re-checks files only every 2 seconds)
opcache.revalidate_freq = 0
