# WP-CLI settings for the course's wpcli container (WP_CLI_CONFIG_PATH points here).
# WP-CLI 2.12 (the current release) prints "Deprecated: Using null as an array offset ... Colors.php" after
# every Success/Error line on PHP 8.5. That is WP-CLI's own code, not yours: this file hides deprecations that
# come from inside the WP-CLI program (phar://...) and nothing else.
require:
  - /etc/wp-cli/quiet-wp-cli-deprecations.php
