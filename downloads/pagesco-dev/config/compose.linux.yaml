# Linux and Windows (WSL 2) only: run WordPress and WP-CLI as YOU, so you can edit the files in wordpress/.
# Without it, the WordPress image creates every file as its web server user (uid 33, www-data) and your
# editor gets "Permission denied" in wordpress/wp-content/. Set it up once, before the first start
# (Lesson 1.2), from this project folder:
#   printf 'PAGESCO_UID=%s\nPAGESCO_GID=%s\n' "$(id -u)" "$(id -g)" > .env
#   cp config/compose.linux.yaml compose.override.yaml
#   mkdir wordpress
# Docker Compose reads compose.override.yaml automatically, and .env for the two numbers.
services:
  wordpress:
    user: "${PAGESCO_UID:?run the Linux setup from Lesson 1.2 first}:${PAGESCO_GID:?run the Linux setup from Lesson 1.2 first}"
  wpcli:
    user: "${PAGESCO_UID:?run the Linux setup from Lesson 1.2 first}:${PAGESCO_GID:?run the Linux setup from Lesson 1.2 first}"
